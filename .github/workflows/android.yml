
name: Build MediaLoader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MediaLoader APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Check uploaded ZIP
        run: |
          ls -lah
          test -f "MediaLoader-With-App-Icon.zip"

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q "MediaLoader-With-App-Icon.zip" -d extracted
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        run: |
          find extracted -name gradlew -type f
          find extracted -name settings.gradle.kts -type f

      - name: Build APK
        run: |
          GRADLE_FILE=$(find extracted -name gradlew -type f | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No Gradle wrapper found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          chmod +x "$GRADLE_FILE"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
